[program:lets-hang-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/lets-hang/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/lets-hang/storage/logs/worker.log

[program:lets-hang-reverb]
process_name=%(program_name)s
command=php /var/www/lets-hang/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/lets-hang/storage/logs/reverb.log
